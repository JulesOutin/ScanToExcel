services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scantoexcel
      POSTGRES_PASSWORD: scantoexcel
      POSTGRES_DB: scantoexcel
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db, redis]
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: ./backend/.env
    depends_on: [db, redis]
    volumes: ["./backend:/app"]

  frontend:
    build: ./frontend
    env_file: ./frontend/.env.local
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  db_data:
